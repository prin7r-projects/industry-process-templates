name: Landing build

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "Dockerfile.landing"
      - ".github/workflows/landing-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/landing/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/landing/pnpm-lock.yaml

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm build
